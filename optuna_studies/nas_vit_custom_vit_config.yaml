dataset:
  name: food101
  source: local
  path: ./data
  num_classes: 101
train:
  epochs: 5
  batch_size: 64
  shuffle: true
  lr: 0.0003
  weight_decay: 0.01
  t_max: 10
  label_smoothing: 0.05
  gradient_clip: 1.0
  save_best: true
  seed: 42
  manual_seed_enabled: true
  cutmix: true
  optimizer: adamw
  scheduler:
    name: cosine
  save_dir: ./checkpoints
val:
  batch_size: 8
  shuffle: false
transforms:
  common:
    resize: 224
    mean:
    - 0.5450310707092285
    - 0.4435403347015381
    - 0.3436422348022461
    std:
    - 0.2694936692714691
    - 0.27188628911972046
    - 0.2766088843345642
  train:
    horizontal_flip_p: 0.5
    random_rotation_deg: 15
    random_crop_scale:
    - 0.8
    - 1.0
    color_jitter:
      brightness: 0.2
      contrast: 0.2
      saturation: 0.2
    gaussian_noise:
      mean: 0.0
      std: 0.01
    cutmix:
      alpha: 1.0
      prob: 0.5
  val: null
hardware:
  num_workers: 8
  pin_memory: false
  grad_accum_steps: 4
  device: cuda
_base_: base.yaml
model:
  model_type: custom
  custom_model_type: vit
  num_classes: 101
  image_size: 224
  dropout: 0.1
nas:
  custom_score:
    weights:
      acc: 1.0
      num_params: -0.15
      time_per_epoch: 0
    targets:
      num_params: 25000000
      time_per_epoch: 600
  architecture_search:
    direction: maximize
    sampler: TPESampler
    pruner: MedianPruner
    sampler_params:
      n_startup_trials: 20
    pruner_params:
      n_startup_trials: 20
      n_warmup_steps: 4
    num_trials: 0
    epochs_per_trial: 6
    fallback_dim: 768
    fallback_heads: 12
    model_params:
      heads:
        type: int
        range:
        - 6
        - 12
      dim:
        type: int
        range:
        - 384
        - 512
      depth:
        type: int
        range:
        - 6
        - 10
      mlp_ratio:
        type: float
        range:
        - 1.0
        - 3.0
      patch_size:
        type: categorical
        options:
        - 14
        - 16
  hyperparameters_search:
    direction: maximize
    sampler: TPESampler
    pruner: MedianPruner
    sampler_params:
      n_startup_trials: 10
    pruner_params:
      n_startup_trials: 10
      n_warmup_steps: 4
    num_trials: 20
    epochs_per_trial: 6
    hyper_params:
      lr:
        type: float
        range:
        - 1.0e-05
        - 0.001
        log: true
      dropout:
        type: float
        range:
        - 0.0
        - 0.3
      weight_decay:
        type: float
        range:
        - 0.0001
        - 0.01
        log: true
      batch_size:
        type: categorical
        options:
        - 16
        - 32
        - 64
  study_name: nas_vit_custom_vit
  study_db_path: sqlite:///optuna_studies\nas_vit_custom_vit.db
