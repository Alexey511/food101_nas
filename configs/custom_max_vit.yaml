_base_: base.yaml

model:
  model_type: custom
  custom_model_type: vit
  num_classes: 101
  image_size: 224
  
  # Максимальные параметры из nas_vit.yaml для теста VRAM
  heads: 12
  dim: 504
  depth: 10
  mlp_ratio: 3.0
  patch_size: 14
  dropout: 0.1

train:
  lr: 2e-4
  epochs: 80
  batch_size: 64
  optimizer: adamw
  weight_decay: 0.01
  scheduler:
    name: cosine
  save_dir: ./checkpoints
  save_best: true

hardware:
  num_workers: 8
  pin_memory: false
  grad_accum_steps: 2
  device: cuda
